# nginx для React-приложения (SPA): отдаёт собранные файлы, а любой неизвестный адрес (/doctor/login, /cabinet/tickets…)
# отдаёт index.html, дальше маршрутизацию делает сам React. Запросы к API сюда не приходят: браузер ходит на адрес из config.js.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # заголовки безопасности (add_header ниже по тексту не используется, поэтому они действуют для всех адресов)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # файлы сборки имеют в имени хэш содержимого: их можно хранить в кэше год
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # настройки и главная страница не кэшируются, иначе после смены адреса API или новой версии сайта браузер показал бы старое
    location = /config.js {
        expires -1;
    }
    location = /index.html {
        expires -1;
    }

    # проверка для Docker/обратного прокси, что nginx отвечает
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
